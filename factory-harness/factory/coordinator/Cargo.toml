[package]
name = "factory-coordinator"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[features]
acceptance-fixtures = []

[lib]
name = "factory_coordinator"
path = "src/lib.rs"

[[bin]]
name = "factoryd"
path = "src/main.rs"

[[bin]]
name = "factory-runner-fixture"
path = "src/bin/factory_runner_fixture.rs"
required-features = ["acceptance-fixtures"]

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
chrono = { version = "0.4.43", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9.0", default-features = false, features = ["chrono", "derive", "json", "postgres", "runtime-tokio", "tls-rustls"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
