[package]
name = "factory-runtime"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "factory_runtime"
path = "src/lib.rs"

[[bin]]
name = "factory-runtime"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
codex-app-server = { path = "../../codex-rs/app-server" }
codex-app-server-client = { path = "../../codex-rs/app-server-client" }
codex-arg0 = { path = "../../codex-rs/arg0" }
codex-config = { path = "../../codex-rs/config" }
codex-utils-cli = { path = "../../codex-rs/utils/cli" }
factory-extension = { path = "../extension" }
factory-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
sha2 = "0.10"
