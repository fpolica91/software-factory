[package]
name = "factory-protocol"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "factory_protocol"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
codex-app-server-protocol = { path = "../../codex-rs/app-server-protocol" }
schemars = "0.8.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
ts-rs = "11"
