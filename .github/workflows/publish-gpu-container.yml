name: Publish Factory GPU container

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - deploy/gpu/**
      - .github/workflows/publish-gpu-container.yml

concurrency:
  group: publish-gpu-container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/software-factory
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Free build disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/gpu/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=factory-gpu-${{ matrix.arch }}
          cache-to: type=gha,scope=factory-gpu-${{ matrix.arch }},mode=min,ignore-error=true
          provenance: false
          sbom: false

      - name: Export image digest
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: gpu-digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-architecture GPU tags
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          pattern: gpu-digests-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=gpu-pytorch-25.08
            type=raw,value=gpu-pytorch-25.08-${{ github.sha }}

      - name: Create multi-architecture manifest
        working-directory: /tmp/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          arguments=()
          for tag in "${tags[@]}"; do
            arguments+=(-t "$tag")
          done
          while IFS= read -r digest; do
            arguments+=("${IMAGE_NAME}@sha256:${digest}")
          done < <(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          docker buildx imagetools create "${arguments[@]}"

      - name: Inspect published image
        run: docker buildx imagetools inspect "${IMAGE_NAME}:gpu-pytorch-25.08"
